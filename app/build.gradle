plugins {
id 'com.android.application'
}

android {
namespace 'sk.menu.launcher'
compileSdk 35

defaultConfig {
    applicationId "sk.menu.launcher"
    minSdk 21
    targetSdk 35
    versionCode 1
    versionName "1.0"
}

buildTypes {
    release {
        minifyEnabled false
    }
}

compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}


}

dependencies {
}